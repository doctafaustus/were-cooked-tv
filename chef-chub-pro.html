<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chef Chub Pro</title>
<style>
:root {
  --panel: rgba(22, 24, 32, 0.86);
  --ink: #f2f1f5;
  --muted: #a9aec0;
  --line: rgba(255, 255, 255, 0.12);
  --accent: #2f8fd8;
  --rec: #e5484d;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; font-family: var(--font); color: var(--ink); }
body { background: #1a1c24; }
/* checkerboard = transparent; only the preview shows it, recordings stay transparent */
body.bg-clear { background: #3a3d48 repeating-conic-gradient(#4a4e5a 0 25%, #3a3d48 0 50%) 0 0 / 28px 28px; }
body.bg-green { background: #00ff00; }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.panel {
  position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 14px;
  max-width: calc(100% - 32px);
  padding: 10px 12px; border-radius: 16px;
  background: var(--panel); border: 1px solid var(--line);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  font-size: 13px;
}
body.clean .panel, body.clean .meter, body.clean .hint { display: none; }
.group { display: flex; align-items: center; gap: 6px; }
.label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sep { width: 1px; height: 22px; background: var(--line); }
button, .file {
  font: 500 13px/1 var(--font); color: var(--ink);
  background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 999px;
  padding: 7px 12px; cursor: pointer;
}
button:hover, .file:hover { background: rgba(255,255,255,.12); }
button[aria-pressed="true"] { background: var(--ink); color: #15161c; }
button.rec[aria-pressed="true"] { background: var(--rec); color: #fff; border-color: var(--rec); }
.file input { display: none; }
input[type=range] { width: 90px; accent-color: var(--accent); }
.fname { max-width: 16ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 12px; }
.meter {
  position: fixed; right: 16px; top: 16px; width: 10px; height: 120px; border-radius: 6px;
  background: rgba(0,0,0,.35); border: 1px solid var(--line); overflow: hidden;
}
.meter i { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: #7ee08a; }
.hint { position: fixed; left: 16px; top: 14px; font-size: 12px; color: rgba(255,255,255,.75); text-shadow: 0 1px 2px rgba(0,0,0,.6); }
body.bg-green .hint { color: #222; text-shadow: none; }
.toast {
  position: fixed; left: 50%; top: 16px; transform: translateX(-50%);
  padding: 8px 14px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: 13px;
}
</style>
</head>
<body class="bg-clear">
<canvas id="stage" aria-label="Chef Chub, a chubby white cartoon cat in a chef hat, who lip-syncs to audio"></canvas>
<div class="hint" id="hint">Drag to turn him · scroll to zoom · H hides the controls · 1 2 3 play actions</div>
<div class="meter" aria-hidden="true"><i id="meterFill"></i></div>

<div class="panel" role="toolbar" aria-label="Controls">
  <div class="group">
    <label class="file">Load audio<input id="fileIn" type="file" accept="audio/*,video/*"></label>
    <span class="fname" id="fname">no file</span>
    <button id="play">Play</button>
    <button id="mic" aria-pressed="false">Mic</button>
    <button id="test" aria-pressed="false" title="Fake babble so you can see the mouth without audio">Test talk</button>
    <button id="ziggy" aria-pressed="false" title="Plays this video's voiceover with its pre-baked mouth track (works straight from the file, no upload)">Speak voice</button>
  </div>
  <span class="sep"></span>
  <div class="group">
    <span class="label">Gain</span><input id="gain" type="range" min="0.3" max="3" step="0.05" value="1.2">
    <span class="label">Gate</span><input id="gate" type="range" min="0" max="0.3" step="0.01" value="0.06">
  </div>
  <span class="sep"></span>
  <div class="group">
    <span class="label">Bg</span>
    <button data-bg="clear" aria-pressed="true">None</button>
    <button data-bg="green" aria-pressed="false">Green</button>
  </div>
  <span class="sep"></span>
  <div class="group">
    <span class="label">Do</span>
    <button data-act="wave" aria-pressed="false" title="Key 1">Wave</button>
    <button data-act="kiss" aria-pressed="false" title="Key 2">Chef's kiss</button>
    <button data-act="pan" aria-pressed="false" title="Key 3">Pan flip</button>
  </div>
  <span class="sep"></span>
  <div class="group">
    <button id="reset">Reset view</button>
    <button id="rec" class="rec" aria-pressed="false" title="Records the canvas + audio to a .webm (transparent if Bg is None)">Record</button>
  </div>
</div>

<script>
  // which video to load: ?video=<folder under videos/> (its voice, mouth track and cue sheet;
  // local.js holds this machine's paths and is git-ignored)
  (function () {
    const v = new URLSearchParams(location.search).get("video") || "crispy-cranberry-chicken";
    if (!/^[a-z0-9-]+$/.test(v)) throw new Error("video names are lowercase-with-dashes: " + v);
    window.CHUB_DIR = "videos/" + v + "/";
    ["video.js", "local.js", "lipsync.js"].forEach(f => document.write('<script src="' + window.CHUB_DIR + f + '"><\/script>'));
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  function showToast(msg, ms) {
    document.querySelectorAll(".toast").forEach(t => t.remove());
    const d = document.createElement("div");
    d.className = "toast"; d.textContent = msg;
    document.body.appendChild(d);
    if (ms) setTimeout(() => d.remove(), ms);
  }
  if (!window.THREE || !THREE.OrbitControls) { showToast("three.js didn't load — check your connection and reload."); return; }
  start();

  function start() {
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (window.matchMedia("(pointer: coarse)").matches) document.getElementById("hint").textContent =
    "Drag to look around · pinch to zoom · two-finger drag to pan";

  /* ---------- renderer / camera ---------- */
  const canvas = document.getElementById("stage");
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  } catch (e) {
    showToast("This browser can't show 3D (WebGL is off).");
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 3.5;
  controls.maxDistance = 34;
  controls.maxPolarAngle = Math.PI * 0.53;
  controls.autoRotateSpeed = 1.4;

  /* ---------- shading ----------
     Modern anime-style cel shader, built from the techniques current toon games use:
       - hue-shifted, more saturated shadow colour instead of plain darkening (painted ramp)
       - occlusion pushes the light/shadow threshold (Guilty Gear Xrd's threshold offset),
         plus a deeper tone in tight creases
       - a crisp terminator anti-aliased with fwidth, so the edge is pixel-clean at any zoom
       - a narrow warm band right on the terminator (the "SSS line" of Genshin / Endfield)
       - a constant-width screen-space rim light found by sampling a depth prepass
         (Genshin-style depth-offset rim), on the side away from the key light
       - face normals blended toward a sphere so the face takes clean, simple shadow shapes
       - hard-edged stylised specular
     The light rides with the camera, so he is nicely lit from every angle. */
  const look = { soft: 0.0 };          // extra edge softness on top of the AA'd terminator
  const furMats = [];
  // shared by every cel material; filled in by the depth prepass each frame
  const SHARED = {
    uDepth: { value: null },
    uRes: { value: new THREE.Vector2(1, 1) },
    uNear: { value: 0.1 }, uFar: { value: 100 },
    uRimPx: { value: 5.0 },
    uLight: { value: new THREE.Vector3(-0.66, 0.55, 0.5).normalize() }
  };

  const FUR_VERT = `
    #include <common>
    #include <skinning_pars_vertex>
    #ifdef COAT
    attribute float aPaint;
    varying float vPaint;
    #endif
    varying vec3 vN; varying vec3 vV; varying vec3 vW; varying vec3 vNW;
    #if defined(EAR_HOLES) || defined(COAT) || defined(SLEEVE) || defined(FACE) || defined(MITTEN)
    varying vec3 vHL;
    #endif
    #ifdef FACE
    varying vec3 vSN;
    #endif
    void main() {
      #if defined(EAR_HOLES) || defined(COAT) || defined(SLEEVE) || defined(FACE) || defined(MITTEN)
      vHL = position;
      #endif
      #ifdef FACE
      // the direction from the head's centre: a "sphere normal" for simple face shadows
      vSN = normalize(normalMatrix * (position * vec3(0.8, 1.15, 0.9)));
      #endif
      #ifdef COAT
      vPaint = aPaint;
      #endif
      #include <skinbase_vertex>
      #include <begin_vertex>
      #include <beginnormal_vertex>
      #include <skinnormal_vertex>
      #include <skinning_vertex>
      vec4 mv = modelViewMatrix * vec4(transformed, 1.0);
      vN = normalize(normalMatrix * objectNormal);
      vNW = (vec4(vN, 0.0) * viewMatrix).xyz;
      vV = mv.xyz;
      vW = (modelMatrix * vec4(transformed, 1.0)).xyz;
      gl_Position = projectionMatrix * mv;
    }`;
  const FUR_FRAG = `
    uniform vec3 uColor; uniform float uSoft; uniform float uSpec;
    uniform vec3 uAOc; uniform vec3 uAOr; uniform float uAOon; uniform float uGround;
    uniform float uFabric; uniform float uHem; uniform float uHemOn;
    uniform sampler2D uDepth; uniform vec2 uRes; uniform float uNear; uniform float uFar;
    uniform float uRimPx; uniform vec3 uLight; uniform float uRim;
    varying vec3 vN; varying vec3 vV; varying vec3 vW; varying vec3 vNW;
    #ifdef FACE
    varying vec3 vSN;
    #endif
    float linDepth(float d) {
      float z = d * 2.0 - 1.0;
      return 2.0 * uNear * uFar / (uFar + uNear - z * (uFar - uNear));
    }
    #ifdef SLEEVE
    varying vec3 vHL;
    #endif
    #ifdef MITTEN
    varying vec3 vHL;
    #endif
    #ifdef COAT
    varying vec3 vHL;
    varying float vPaint;
    // a soft-edged disc in (arc length, height) space around the body
    float disc(vec2 d, float r) { return 1.0 - smoothstep(r - 0.004, r + 0.002, length(d)); }
    #endif
    #ifdef EAR_HOLES
    uniform float uEarR[13];
    varying vec3 vHL;
    float earRadius(float h) {
      float r = 0.0;
      for (int i = 0; i < 12; i++) {
        float h0 = float(i) * 0.04;
        if (h >= h0 && h < h0 + 0.04) r = mix(uEarR[i], uEarR[i + 1], (h - h0) / 0.04);
      }
      return r;
    }
    bool inEar(vec3 p, float side) {
      float s = sin(0.34), c = cos(0.34);
      vec3 v = p - vec3(side * 0.53, 0.5, 0.03);
      float h = dot(v, vec3(side * s, c, 0.0));
      if (h < 0.0 || h > 0.48) return false;
      float er = earRadius(h);
      float a = dot(v, vec3(c, -side * s, 0.0)) / (er + 0.026);
      float b = v.z / (0.5 * er + 0.026);
      return a * a + b * b < 1.0;
    }
    #endif
    void main() {
      #ifdef EAR_HOLES
      if (inEar(vHL, -1.0) || inEar(vHL, 1.0)) discard;
      #endif
      vec3 base = uColor;
      #ifdef COAT
      {
        /* the chef coat, painted straight onto the body (body mesh is turned 180deg, so front is -z) */
        vec3 p = vHL;
        float a = atan(-p.x, -p.z);
        float rr = length(p.xz);
        float y = p.y;
        float hem = 0.72 + 0.012 * cos(a);
        vec3 coat = vec3(0.17, 0.56, 0.855);
        vec3 coatDk = vec3(0.11, 0.39, 0.64);
        vec3 red = vec3(0.86, 0.23, 0.18);
        vec3 ink = vec3(0.2, 0.18, 0.22);
        float inCoat = smoothstep(hem - 0.004, hem + 0.004, y);
        base = mix(uColor, coat, inCoat);
        // a faint fold shadow just above the hem
        base = mix(base, coatDk, 0.25 * inCoat * (1.0 - smoothstep(hem, hem + 0.09, y)));
        // red piping down the front flap
        float flap = 0.1 + 0.06 * smoothstep(0.0, 1.0, (1.75 - y) / 0.9);
        float dp = abs(a - flap) * rr;
        float pip = (1.0 - smoothstep(0.015, 0.021, dp)) * smoothstep(hem + 0.015, hem + 0.03, y);
        base = mix(base, red, pip);
        // arms: coat-blue sleeve, a red cuff band, then the white paw
        if (vPaint >= 0.0) {
          base = mix(base, red, smoothstep(0.655, 0.67, vPaint));
          base = mix(base, uColor, smoothstep(0.735, 0.75, vPaint));
        }
        // two rows of buttons: plain dark-blue discs, no rim or highlight
        vec2 B[6];
        B[0] = vec2(-0.3, 1.47); B[1] = vec2(-0.32, 1.2); B[2] = vec2(-0.33, 0.95);
        B[3] = vec2(0.5, 1.47);  B[4] = vec2(0.52, 1.2);  B[5] = vec2(0.53, 0.95);
        for (int i = 0; i < 6; i++) {
          vec2 d = vec2((a - B[i].x) * rr, y - B[i].y);
          base = mix(base, mix(coatDk, coat, 0.35), disc(d, 0.045));
        }
        // drawn line along the hem
        base = mix(base, ink, 1.0 - smoothstep(0.007, 0.012, abs(y - hem)));
      }
      #endif
      #ifdef MITTEN
      {
        float y = vHL.y;
        vec3 paw = vec3(0.984, 0.98, 0.972), red = vec3(0.86, 0.23, 0.18);
        // blue sleeve down to its rim, white paw nub below
        base = mix(paw, uColor, smoothstep(-0.207, -0.201, y));
      }
      #endif
      #ifdef SLEEVE
      // red cuff band painted onto the sleeve, just above the paw
      base = mix(base, vec3(0.86, 0.23, 0.18), smoothstep(-0.172, -0.166, vHL.y) * (1.0 - smoothstep(-0.11, -0.104, vHL.y)));
      #endif
      vec3 N = normalize(vN);
      if (!gl_FrontFacing) N = -N;
      vec3 V = normalize(-vV);
      vec3 L = normalize(uLight);
      #ifdef FACE
      N = normalize(mix(N, normalize(vSN), 0.55));
      #endif

      /* occlusion, 0 = open, 1 = tucked away: under the head, near the floor, under the hem */
      vec3 q = (vW - uAOc) / uAOr;
      float ao = uAOon * (1.0 - smoothstep(0.98, 1.32, length(q)));
      ao = max(ao, 0.6 * (1.0 - smoothstep(0.0, 0.4, vW.y - uGround)));
      float dh = uHem - vW.y;
      ao = max(ao, 0.5 * uHemOn * step(0.0, dh) * (1.0 - smoothstep(0.0, 0.12, dh)));

      /* palette: shadow is a hue-shifted, more saturated version of the base, never grey */
      float lum = dot(base, vec3(0.299, 0.587, 0.114));
      vec3 satB = clamp(mix(vec3(lum), base, 1.35), 0.0, 1.0);
      vec3 shadowC = satB * vec3(0.70, 0.73, 0.90);
      vec3 deepC = satB * vec3(0.52, 0.53, 0.74);
      vec3 termC = clamp(satB * vec3(1.06, 0.80, 0.80) + vec3(0.04, 0.0, 0.0), 0.0, 1.0);

      /* one crisp terminator; occlusion pushes it toward shadow (Xrd threshold offset) */
      float ndl = dot(N, L) * 0.5 + 0.5;                  // half-lambert
      float th = 0.53 + 0.3 * ao - 0.04 * uFabric;
      #ifdef FACE
      th -= 0.17;                                         // keep the face mostly lit
      #endif
      float d = ndl - th;
      float aa = fwidth(d) * 1.1 + uSoft + 0.012 * uFabric;
      float lit = smoothstep(-aa, aa, d);
      vec3 c = mix(shadowC, base, lit);
      // warm line right on the terminator
      float band = smoothstep(-0.045 - aa, -aa, d) * (1.0 - smoothstep(aa * 0.5, aa + 0.035, d));
      c = mix(c, termC * mix(0.86, 1.0, lit), band * 0.32);
      // deep tone where occlusion is strong
      float dd = ao - 0.72;
      c = mix(c, deepC, smoothstep(-fwidth(dd) - 0.02, fwidth(dd) + 0.02, dd) * 0.75);
      // a gentle sky-to-bounce gradient so big forms don't look flat
      c *= mix(0.93, 1.02, smoothstep(-1.0, 0.6, normalize(vNW).y));

      /* hard-edged specular */
      vec3 H = normalize(L + V);
      float sh = dot(N, H) - 0.975;
      c += vec3(uSpec) * smoothstep(-fwidth(sh), fwidth(sh), sh) * lit;

      /* screen-space rim: step a few pixels outward along the normal in the depth prepass;
         if that lands on something much farther (or nothing), this pixel is on the rim */
      vec2 nd = N.xy;
      float nl = length(nd);
      if (uRim > 0.0 && nl > 0.05) {
        nd /= nl;
        float myZ = -vV.z;
        vec2 uv = gl_FragCoord.xy / uRes + nd * uRimPx * (6.0 / myZ) / uRes;
        float behind = linDepth(texture2D(uDepth, uv).x) - myZ;
        float rim = smoothstep(0.25, 0.45, behind);
        rim *= smoothstep(-0.15, 0.35, -dot(nd, normalize(L.xy)));   // the side away from the key
        vec3 rimC = clamp(base * vec3(0.98, 1.0, 1.08) + vec3(0.07, 0.08, 0.12), 0.0, 1.0);
        c = mix(c, rimC, rim * uRim * (1.0 - 0.6 * ao));
      }
      gl_FragColor = vec4(c, 1.0);
    }`;

  function fur(color, opts) {
    opts = opts || {};
    const m = new THREE.ShaderMaterial({
      uniforms: {
        uColor: { value: new THREE.Color(color) },
        uSoft: { value: look.soft },
        uSpec: { value: opts.spec != null ? opts.spec : 0.0 },
        uAOc: { value: new THREE.Vector3() },
        uAOr: { value: new THREE.Vector3(1, 1, 1) },
        uAOon: { value: opts.ao ? 1 : 0 },
        uGround: { value: 0 },
        uFabric: { value: opts.fabric ? 1 : 0 },
        uHem: { value: -10 },
        uHemOn: { value: opts.hem ? 1 : 0 },
        uRim: { value: opts.rim != null ? opts.rim : 0.85 },
        ...SHARED
      },
      vertexShader: FUR_VERT,
      fragmentShader: FUR_FRAG,
      extensions: { derivatives: true }
    });
    if (opts.coat) m.defines = { COAT: "" };
    if (opts.sleeve) m.defines = { SLEEVE: "" };
    if (opts.face) m.defines = { FACE: "" };
    if (opts.earHoles) {
      m.defines = { EAR_HOLES: "" };
      m.uniforms.uEarR = { value: Array.from({ length: 13 }, (_, i) => earR(i * 0.04)) };
    }
    furMats.push(m);
    return m;
  }

  // Inverted-hull outline: back faces pushed out along the normal, constant on-screen width.
  // Lines take a dark, saturated shade of the colour they wrap (as in Genshin / Xrd) rather
  // than one flat grey, so the blue coat gets navy lines, the scarf maroon, the fur plum-grey.
  const INK = 0x2a2326;
  /* Line width is set in screen pixels (not world units), and the hull is pushed along
     position-averaged "outline normals", so lines stay one even weight across hard edges,
     lathe seams, flattened ears and any object scale. */
  const OUTLINE_SHARED = { uRes: { value: new THREE.Vector2(1, 1) }, uPx: { value: 4 } };
  const OUTLINE_VERT = `
      #include <common>
      #include <skinning_pars_vertex>
      uniform float uWidth; uniform vec2 uRes; uniform float uPx;
      attribute vec3 oNormal;
      void main() {
        #include <skinbase_vertex>
        #include <begin_vertex>
        #include <beginnormal_vertex>
        if (dot(oNormal, oNormal) > 0.25) objectNormal = oNormal;
        #include <skinnormal_vertex>
        #include <skinning_vertex>
        vec4 mv = modelViewMatrix * vec4(transformed, 1.0);
        vec3 nv = normalize(normalMatrix * objectNormal);
        gl_Position = projectionMatrix * mv;
        // push the hull outward in screen space by a constant number of pixels
        vec2 dirPx = (projectionMatrix * vec4(nv, 0.0)).xy * uRes;
        float len = length(dirPx);
        if (len > 1e-6) {
          vec2 off = (dirPx / len) * (uPx * uWidth / 0.0026) * 2.0 / uRes;
          gl_Position.xy += off * gl_Position.w;
        }
      }`;
  const outlineNormalCache = new WeakMap();
  function addOutlineNormals(geo) {
    if (geo.attributes.oNormal || outlineNormalCache.has(geo)) return;
    const pos = geo.attributes.position, nor = geo.attributes.normal;
    if (!nor) { geo.computeVertexNormals(); }
    const N = geo.attributes.normal, acc = new Map(), keys = new Array(pos.count);
    for (let i = 0; i < pos.count; i++) {
      const k = Math.round(pos.getX(i) * 1e4) + "," + Math.round(pos.getY(i) * 1e4) + "," + Math.round(pos.getZ(i) * 1e4);
      keys[i] = k;
      const a = acc.get(k) || [0, 0, 0];
      a[0] += N.getX(i); a[1] += N.getY(i); a[2] += N.getZ(i);
      acc.set(k, a);
    }
    const out = new Float32Array(pos.count * 3);
    for (let i = 0; i < pos.count; i++) {
      const a = acc.get(keys[i]), l = Math.hypot(a[0], a[1], a[2]) || 1;
      out[i * 3] = a[0] / l; out[i * 3 + 1] = a[1] / l; out[i * 3 + 2] = a[2] / l;
    }
    geo.setAttribute("oNormal", new THREE.BufferAttribute(out, 3));
    outlineNormalCache.set(geo, true);
  }
  const shareOutline = m => { Object.assign(m.uniforms, OUTLINE_SHARED); return m; };
  const outlineMats = new Map();
  function outlineFor(mat) {
    const src = mat && mat.uniforms && mat.uniforms.uColor ? mat.uniforms.uColor.value : null;
    const key = src ? src.getHexString() : "ink";
    if (outlineMats.has(key)) return outlineMats.get(key);
    const col = new THREE.Color(0x35303a);
    if (src) {
      const hsl = {};
      src.getHSL(hsl);
      const chroma = Math.max(src.r, src.g, src.b) - Math.min(src.r, src.g, src.b);
      if (chroma < 0.12) col.setHSL(0.72, 0.14, 0.2);         // white/grey -> cool plum-grey

    vertexShader: OUTLINE_VERT.replace("void main() {", "varying float vY;\n      void main() {\n        vY = position.y;"),

  const lipL = [[-0.17, -0.245], [-0.115, -0.283], [-0.045, -0.276], [0, -0.24]];

       tongue - tongue raised toward the teeth ("l", "th", open "ah")

  const mouth = new THREE.Group();
  const MK = 20;                                     // samples per edge

    mouth.position.copy(p);
    mouth.quaternion.setFromUnitVectors(Z, n);
    const rim = fanMesh(INK, 0, -3);
    const inside = fanMesh(0x6b1f2c, 0.002, -4);
    const tongue = fanMesh(0xf28a9c, 0.004, -5);
    const teeth = fanMesh(0xfff6ee, 0.005, -6);

  // write one outline into a fan: top edge left->right, bottom edge right->left, centre at [0]
  function writeFan(mesh, w, top, bot) {
    const a = mesh.geometry.attributes.position.array;
    let cx = 0, cy = 0, k = 3;
    const wb = arguments.length > 4 ? arguments[4] : w;      // bottom edge can be narrower/wider than the top

     the w (x = ±0.115, y = -0.283 on the face) and its top edge follows the w's inner arcs
     up to the nose line, tucked just under the ink stroke. Only the jaw (bottom edge) moves.
     Local units: 1 = 0.13 of the face, origin at y = -0.272. */
  const W_CUSP = 0.885, W_Y = -0.085, W_PEAK = 0.331, TUCK = 0.06, LINE = 0.138;   // LINE = w stroke radius
  const wTop = x => W_Y - TUCK + W_PEAK * Math.pow(Math.max(0, 1 - Math.abs(x) / W_CUSP), 4);
  function setMouth(s) {
    const u = mouth.userData;
    u.teeth.visible = false;                                    // a cartoon cat: no row of human teeth
    const h = 1.2 * s.open;                                     // jaw drop below the w
    if (h < 0.03) { mouth.visible = false; return; }
    mouth.visible = true;
    // the jaw: wider and flatter for "ee", narrower and rounder for "oo"/"oh"
    const wb = W_CUSP * (0.9 + 0.22 * s.wide - 0.32 * s.round);
    const nE = Math.max(1.6, 1.85 + 0.45 * s.wide - 0.35 * s.round);   // ~2 = a soft rounded U, never boxy
    const jaw = (x, w, d) => W_Y - TUCK - d * Math.pow(Math.max(0, 1 - Math.pow(Math.min(1, Math.abs(x) / w), nE)), 1 / nE);
    const bot = x => jaw(x, wb, h);
    writeFan(u.inside, W_CUSP, wTop, bot, wb);
    // outline as thick as his other ink lines, around the jaw only (the w is the top line)
    writeFan(u.rim, W_CUSP + 0.1, wTop, x => jaw(x, wb + LINE * 1.15, h + LINE * 1.55), wb + LINE * 1.15);
    // tongue: a pink dome on the floor of the mouth, bigger on open vowels and "l"/"th"
    const th = h * (0.32 + 0.38 * s.tongue);
    u.tongue.visible = h > 0.18;
    if (u.tongue.visible) {
      const gw = wb * 0.78;
      const dome = x => W_Y - TUCK - h + th * Math.max(0, 1 - (x / gw) * (x / gw));
      writeFan(u.tongue, gw, x => Math.max(bot(x) + 0.015, Math.min(wTop(x) - 0.02, dome(x))), x => bot(x) + 0.015);
    }
  }
  setMouth(mouth.userData.cur);

  blush(head, -0.45, -0.17, 0.14);
  blush(head, 0.45, -0.19, 0.14);
  blushMats.forEach(m => { m.opacity = 0.2; });
  stroke(head, [[-0.535, -0.07], [-0.591, -0.16], [-0.55, -0.255]], R);
  stroke(head, [[0.535, -0.09], [0.591, -0.18], [0.55, -0.275]], R);
  [[-0.41, -0.11], [-0.45, -0.185], [-0.38, -0.225], [0.41, -0.13], [0.45, -0.205], [0.38, -0.245]]
    .forEach(([x, y]) => dot(head, x, y, 0.014));
  [[-0.12, 0.06], [-0.25, -0.1], [-0.38, -0.28]].forEach(([y, t]) => {
    whisker(head, -1, y, 0.3, t);
    whisker(head, 1, y, 0.3, t);
  });

  /* ---------- actions: wave, chef's kiss, frying-pan flip ----------
     Each action blends over the idle/talk pose with an envelope, so it eases in and out of
     whatever he was doing. Lip sync keeps running except while he puckers for the kiss. */
  const ease = x => smo(Math.min(1, Math.max(0, x)));
  const env = (τ, dur, inT, outT) => ease(τ / inT) * ease((dur - τ) / outT);
  const bell = (τ, a, b) => (τ <= a || τ >= b) ? 0 : Math.sin(Math.PI * (τ - a) / (b - a));
  const lerpDir = (a, b, w) => a.clone().lerp(b, w).normalize();
  const act = { name: null, τ: 0, dur: 0, hat: false, sparked: false, launched: false };

  // --- sparkles (world space, face the camera) ---
  const fx = new THREE.Group();
  scene.add(fx);
  const STAR_GEO = (() => {
    const s = new THREE.Shape();
    for (let i = 0; i < 8; i++) {
      const r = i % 2 ? 0.28 : 1, a = (i / 8) * Math.PI * 2 + Math.PI / 2;
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      i ? s.lineTo(x, y) : s.moveTo(x, y);
    }
    return new THREE.ShapeGeometry(s);
  })();
  const sparks = [];
  function burst(at) {
    const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
    const up = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
    for (let i = 0; i < 16; i++) {
      const m = new THREE.Mesh(STAR_GEO, new THREE.MeshBasicMaterial({
        color: i % 3 ? 0xffd86b : 0xffffff, transparent: true, depthWrite: false, side: THREE.DoubleSide }));
      const a = Math.random() * Math.PI * 2, sp = 1.2 + Math.random() * 1.4;
      m.position.copy(at);
      m.userData = { v: right.clone().multiplyScalar(Math.cos(a) * sp).addScaledVector(up, Math.sin(a) * sp + 0.6), life: 0, max: 0.7 + Math.random() * 0.4, s: 0.12 + Math.random() * 0.12, spin: (Math.random() - 0.5) * 8 };
      fx.add(m); sparks.push(m);
    }
  }
  function updateSparks(dt) {
    for (let i = sparks.length - 1; i >= 0; i--) {
      const m = sparks[i], u = m.userData;
      u.life += dt;
      const k = u.life / u.max;
      if (k >= 1) { fx.remove(m); m.material.dispose(); sparks.splice(i, 1); continue; }
      u.v.multiplyScalar(Math.exp(-dt * 2.5));
      u.v.y -= dt * 0.8;
      m.position.addScaledVector(u.v, dt);
      m.quaternion.copy(camera.quaternion);
      m.rotateZ(u.life * u.spin);
      m.scale.setScalar(u.s * Math.sin(Math.PI * Math.min(1, k * 1.6 + 0.1)) * (1 + 0.3 * Math.sin(u.life * 30)));
      m.material.opacity = 1 - k * k;
    }
  }

  // --- frying pan + pancake ---
  const panG = new THREE.Group();
  {
    const prof = [[0, 0], [0.33, 0], [0.37, 0.02], [0.4, 0.1], [0.385, 0.105], [0.35, 0.035], [0.31, 0.025], [0, 0.025]]
      .map(([r, y]) => new THREE.Vector2(r, y));
    const pan = withOutline(new THREE.Mesh(new THREE.LatheGeometry(prof, 48), fur(0x34363e, { spec: 0.18, rim: 0.6 })));
    pan.position.z = 0.78;
    const handle = withOutline(new THREE.Mesh(new THREE.CapsuleGeometry(0.04, 0.42, 6, 12), fur(0x6b4a2f, { fabric: true })));
    handle.rotation.x = Math.PI / 2;
    handle.position.set(0, 0.04, 0.2);
    panG.add(pan, handle);
  }
  panG.visible = false;
  bodyG.add(panG);
  const cake = new THREE.Group();
  {
    const c = withOutline(new THREE.Mesh(new THREE.CylinderGeometry(0.27, 0.26, 0.07, 40), fur(0xe2a54a, { fabric: true })));
    const top = new THREE.Mesh(new THREE.CircleGeometry(0.2, 32), new THREE.MeshBasicMaterial({ color: 0xc9822f }));
    top.rotation.x = -Math.PI / 2; top.position.y = 0.036;
    const butter = withOutline(new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.045, 0.1), fur(0xfff1a8)));
    butter.position.y = 0.06; butter.rotation.y = 0.5;
    cake.add(c, top, butter);
  }
  cake.visible = false;
  bodyG.add(cake);
  const hatTop = new THREE.Object3D();
  hatTop.position.set(0, 1.8, 0);
  hatG.add(hatTop);
  const cakeP = { from: new THREE.Vector3(), spin: 0 };
  const tv = new THREE.Vector3(), tv2 = new THREE.Vector3();
  const pawLocal = (a, out) => { bodyG.updateMatrixWorld(true); return bodyG.worldToLocal(a.paw.getWorldPosition(out)); };
  function panSpot(out) { return out.set(0, 0.07, 0.78).applyEuler(panG.rotation).multiplyScalar(panG.scale.x).add(panG.position); }

  const DUR = { wave: 2.8, kiss: 2.1, pan: 3.4, panHat: 4.2 };
  function startAct(name) {
    act.name = name; act.τ = 0; act.sparked = false; act.launched = false;
    act.hat = name === "pan" && Math.random() < 0.25;          // sometimes it lands on his hat
    act.dur = name === "pan" ? (act.hat ? DUR.panHat : DUR.pan) : DUR[name];
    panG.visible = cake.visible = false;
    document.querySelectorAll("[data-act]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.act === name)));
  }
  function endAct() {
    act.name = null;
    panG.visible = cake.visible = false;
    arms.forEach(a => { a.pivot.position.copy(a.base); a.hand.position.set(0, a.handY, 0); a.paw.quaternion.copy(a.paw.userData.q0); });
    document.querySelectorAll("[data-act]").forEach(b => b.setAttribute("aria-pressed", "false"));
  }

  function runAct(t, dt) {
    updateSparks(dt);
    arms.forEach(a => { a.pivot.position.copy(a.base); a.hand.position.set(0, a.handY, 0); a.paw.quaternion.copy(a.paw.userData.q0); });
    if (!act.name) return;
    act.τ += dt;
    const τ = act.τ, dur = act.dur;
    if (τ >= dur) { endAct(); return; }
    const R = arms[1], Lf = arms[0];                     // R: his gesturing arm (+x), Lf: the other (-x)
    const setArm = (a, dir, w) => a.pivot.quaternion.setFromUnitVectors(DOWN, lerpDir(a.dir, dir, w));
    const happyEyes = w => eyes.forEach(e => { e.scale.y = Math.min(e.scale.y, 1 - 0.88 * w); });

    if (act.name === "wave") {
      const w = env(τ, dur, 0.3, 0.4);
      const θ = 0.55 + 0.32 * Math.sin(τ * 13);
      setArm(R, new THREE.Vector3(Math.sin(θ), Math.cos(θ), 0.35).normalize(), w);
      R.paw.quaternion.copy(R.paw.userData.q0); R.paw.rotateZ(0.45 * Math.sin(τ * 13 + 0.7) * w);
      bodyG.rotation.z += -0.05 * Math.sin(τ * 6.5) * w;
      head.rotation.z += 0.13 * w;
      head.rotation.x += -0.05 * w;
      happyEyes(0.35 * w);
    }

    if (act.name === "kiss") {
      // raise paw to lips -> hold (pucker) -> fling out and up with a burst of sparkles -> back
      const toMouth = ease(τ / 0.4) * (1 - ease((τ - 0.85) / 0.2));
      const fling = ease((τ - 0.85) / 0.16) * (1 - ease((τ - 1.45) / 0.5));
      // the shoulder stays put (the arm is part of the body mesh); the arm reaches and stretches
      const mouthT = new THREE.Vector3(0.16, 2.2, 1.28);
      const toLips = mouthT.clone().sub(R.pivot.position);
      const reach = toLips.length();
      // slide the hand bone out so the paw reaches the lips (rigid bones, so shading stays clean)
      const extra = Math.min(0.12, Math.max(0, reach - 0.75));   // a little extra reach
      R.hand.position.y = R.handY - extra * toMouth;
      let dir = lerpDir(R.dir, toLips.normalize(), toMouth);
      dir = lerpDir(dir, new THREE.Vector3(0.75, 0.55, 0.55).normalize(), fling);
      R.pivot.quaternion.setFromUnitVectors(DOWN, dir);
      happyEyes(Math.max(toMouth, fling));
      // he meets his paw halfway: head dips forward and turns toward it
      head.rotation.x += 0.22 * toMouth - 0.28 * fling;
      head.rotation.y += 0.3 * toMouth;
      head.rotation.z += -0.12 * toMouth - 0.1 * fling;
      bodyG.rotation.z += -0.04 * fling;
      const pucker = bell(τ, 0.3, 0.95);
      if (pucker > 0.05) {
        setMouth({ open: 0.32 * pucker, wide: 0, round: 1, teeth: 0, tongue: 0 });
      }
      if (!act.sparked && τ > 0.95) {
        act.sparked = true;
        bodyG.updateMatrixWorld(true);
        burst(R.paw.getWorldPosition(new THREE.Vector3()));
      }
    }

    if (act.name === "pan") {
      const s = -1;                                         // the pan goes in his other paw
      const w = env(τ, dur, 0.35, 0.45);
      const flick = bell(τ, 0.55, 0.9);
      setArm(Lf, new THREE.Vector3(s * 0.32, -0.35 + 0.45 * flick, 0.88).normalize(), w);
      bodyG.updateMatrixWorld(true);
      pawLocal(Lf, tv);
      panG.visible = w > 0.02;
      const pop = Math.min(1, τ / 0.28), out = (dur - τ) / 0.3;
      const sc = (pop < 1 ? 1 + 0.25 * Math.sin(pop * Math.PI) * (1 - pop) : 1) * ease(pop) * ease(out);
      panG.scale.setScalar(Math.max(0.001, sc));
      panG.position.copy(tv);
      panG.rotation.set(-0.55 * flick, s * -0.45, 0);
      const T0 = 0.68, T = 1.1, land = T0 + T;
      if (τ < T0) { cake.visible = panG.visible; panSpot(cake.position); cake.rotation.set(0, 0, 0); cake.scale.setScalar(Math.max(0.001, sc)); }
      else if (τ < land) {
        if (!act.launched) { act.launched = true; panSpot(cakeP.from); }
        const k = (τ - T0) / T;
        const target = act.hat ? (bodyG.updateMatrixWorld(true), bodyG.worldToLocal(hatTop.getWorldPosition(tv2))) : panSpot(tv2);
        const peak = (act.hat ? 1.6 : 1.45);
        cake.position.lerpVectors(cakeP.from, target, k);
        cake.position.y += 4 * peak * k * (1 - k) + (act.hat ? 0 : 0);
        cake.rotation.set(k * Math.PI * 2 * (act.hat ? 1.5 : 1), 0, 0.3 * Math.sin(k * Math.PI));
        cake.scale.setScalar(1);
        head.rotation.x -= 0.32 * Math.sin(Math.PI * k);         // eyes follow it up
      } else if (!act.hat) {
        // caught! a little squash on the pan, then a proud double nod
        const c = τ - land;
        panSpot(cake.position);
        cake.rotation.set(0, 0, 0);
        const sq = Math.exp(-c * 9) * Math.cos(c * 30);
        cake.scale.set(1 + 0.25 * sq, Math.max(0.001, (1 - 0.35 * sq)) * ease(out), 1 + 0.25 * sq);
        cake.scale.x *= ease(out); cake.scale.z *= ease(out);
        panG.position.y -= 0.06 * Math.exp(-c * 8);
        head.rotation.x += 0.13 * bell(c, 0.15, 0.55) + 0.1 * bell(c, 0.6, 1.0);
        happyEyes(bell(c, 0.1, 1.4));
      } else {
        // it landed on his hat: he looks up, deadpan, then it slides off behind him
        const c = τ - land;
        bodyG.updateMatrixWorld(true);
        const top = bodyG.worldToLocal(hatTop.getWorldPosition(tv2));
        const slide = ease((c - 1.4) / 0.9);
        cake.position.copy(top).add(new THREE.Vector3(0, 0.03 - 1.2 * slide * slide, -0.55 * slide));
        cake.rotation.set(-0.9 * slide, 0, 0.05 * Math.sin(c * 9) * Math.exp(-c * 3));
        cake.scale.setScalar(Math.max(0.001, 1 - slide));
        head.rotation.x -= 0.22 * ease(c / 0.3) * (1 - slide);
        eyes.forEach(e => { e.scale.y = Math.min(e.scale.y, 0.55 + 0.45 * slide); });
      }
      cake.visible = panG.visible || (act.hat && τ > T0);
    }
  }
  document.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => startAct(b.dataset.act)));

  /* ---------- audio: file, mic, or fake babble -> one smoothed "loudness" value ---------- */
  const A = { ctx: null, an: null, buf: null, el: new Audio(), elSrc: null, mic: null, dest: null, test: false, level: 0, raw: 0 };
  A.el.crossOrigin = "anonymous";
  function ensureCtx() {
    if (A.ctx) return;
    A.ctx = new (window.AudioContext || window.webkitAudioContext)();
    A.an = A.ctx.createAnalyser();
    A.an.fftSize = 1024;
    A.buf = new Float32Array(A.an.fftSize);
    A.dest = A.ctx.createMediaStreamDestination();      // what the recorder hears
    // a voice band filter so breaths and bass rumble don't flap the mouth
    A.hp = A.ctx.createBiquadFilter(); A.hp.type = "highpass"; A.hp.frequency.value = 180;
    A.lp = A.ctx.createBiquadFilter(); A.lp.type = "lowpass"; A.lp.frequency.value = 3800;
    A.hp.connect(A.lp); A.lp.connect(A.an);
  }
  const fileIn = document.getElementById("fileIn");
  const playBtn = document.getElementById("play");
  fileIn.addEventListener("change", () => {
    const f = fileIn.files[0];
    if (!f) return;
    ensureCtx();
    A.el.src = URL.createObjectURL(f);
    document.getElementById("fname").textContent = f.name;
    if (!A.elSrc) {
      A.elSrc = A.ctx.createMediaElementSource(A.el);
      A.elSrc.connect(A.hp);
      A.elSrc.connect(A.ctx.destination);
      A.elSrc.connect(A.dest);
    }
    playBtn.textContent = "Play";
  });
  playBtn.addEventListener("click", async () => {
    if (!A.el.src) { showToast("Load an audio file first", 1800); return; }
    ensureCtx(); await A.ctx.resume();
    if (A.el.paused) A.el.play(); else A.el.pause();
  });
  A.el.addEventListener("play", () => { playBtn.textContent = "Pause"; });
  A.el.addEventListener("pause", () => { playBtn.textContent = "Play"; });
  A.el.addEventListener("ended", () => { playBtn.textContent = "Play"; if (rec) rec.stop(); });

  const micBtn = document.getElementById("mic");
  micBtn.addEventListener("click", async () => {
    ensureCtx(); await A.ctx.resume();
    if (A.mic) {
      A.mic.stream.getTracks().forEach(t => t.stop());
      A.mic.node.disconnect(); A.mic = null;
      micBtn.setAttribute("aria-pressed", "false");
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: true } });
      const node = A.ctx.createMediaStreamSource(stream);
      node.connect(A.hp);
      A.mic = { stream, node };
      micBtn.setAttribute("aria-pressed", "true");
    } catch (e) { showToast("Mic blocked: " + e.message, 2500); }
  });
  const testBtn = document.getElementById("test");
  testBtn.addEventListener("click", () => {
    A.test = !A.test;
    testBtn.setAttribute("aria-pressed", String(A.test));
  });
  const gainIn = document.getElementById("gain"), gateIn = document.getElementById("gate");

  /* The voiceover: plays the video folder's voice mp3 directly (not through Web Audio, which Chrome
     silences for file:// media) and drives the mouth from a loudness track baked
     from the same file, looked up at the audio's current time so they stay in sync. */
  const CFG = window.CHUB_VIDEO || {}, VOICE = CFG.voiceName || "voice";
  const ZG = { el: new Audio(window.CHUB_DIR + (CFG.voice || "voice.mp3")), env: window.CHUB_LIPSYNC || null };
  ZG.el.preload = "auto";
  const zBtn = document.getElementById("ziggy");
  zBtn.textContent = "Speak " + VOICE;
  function zSample(key) {
    const d = ZG.env && ZG.env[key];
    if (!d || ZG.el.paused) return null;
    const f = ZG.el.currentTime * ZG.env.fps, i = Math.floor(f);
    if (i < 0 || i >= d.length - 1) return null;
    return (d[i] + (d[i + 1] - d[i]) * (f - i)) / 99;
  }
  const zLevel = () => zSample("data") || 0;
  // the baked mouth shape at the current audio time, or null when Ziggy isn't speaking
  function zShape() {
    const open = zSample("open");
    if (open == null) return null;
    return { open, wide: zSample("wide"), round: zSample("round"), teeth: zSample("teeth"), tongue: zSample("tongue") };
  }
  zBtn.addEventListener("click", () => {
    if (!ZG.env) { showToast("lipsync.js is missing in " + window.CHUB_DIR, 2500); return; }
    if (ZG.el.paused) { if (ZG.el.ended) ZG.el.currentTime = 0; ZG.el.play().catch(e => showToast("Couldn't play " + window.CHUB_DIR + (CFG.voice || "voice.mp3") + ": " + e.message, 2500)); }
    else ZG.el.pause();
  });
  ZG.el.addEventListener("play", () => { zBtn.textContent = "Pause " + VOICE; zBtn.setAttribute("aria-pressed", "true"); });
  ZG.el.addEventListener("pause", () => { zBtn.textContent = "Speak " + VOICE; zBtn.setAttribute("aria-pressed", "false"); });
  ZG.el.addEventListener("ended", () => { ZG.el.currentTime = 0; if (rec) rec.stop(); });

  // fake speech: syllables at ~5/s with pauses between "words"
  let babT = 0, babNext = 0, babAmp = 0;
  function babble(dt) {
    babT += dt;
    if (babT >= babNext) {
      babT = 0;
      const pause = Math.random() < 0.18;
      babNext = pause ? 0.25 + Math.random() * 0.35 : 0.12 + Math.random() * 0.12;
      babAmp = pause ? 0 : 0.45 + Math.random() * 0.55;
    }
    return babAmp * Math.sin(Math.min(1, babT / babNext) * Math.PI);
  }

  function readLevel(dt) {
    let v = 0;
    if (A.an && (A.mic || (A.el.src && !A.el.paused))) {
      A.an.getFloatTimeDomainData(A.buf);
      let s = 0;
      for (let i = 0; i < A.buf.length; i++) s += A.buf[i] * A.buf[i];
      const rms = Math.sqrt(s / A.buf.length);
      const db = 20 * Math.log10(rms + 1e-6);
      v = THREE.MathUtils.clamp((db + 52) / 34, 0, 1);       // -52 dB .. -18 dB -> 0..1
    }
    v = Math.max(v, zLevel());
    if (A.test) v = Math.max(v, babble(dt));
    v = Math.min(1, v * +gainIn.value);
    const gate = +gateIn.value;
    v = v < gate ? 0 : (v - gate) / (1 - gate);
    A.raw = v;
    // fast to open, a bit slower to close -> reads as syllables instead of flicker
    const k = 1 - Math.exp(-dt * (v > A.level ? 38 : 16));
    A.level += (v - A.level) * k;
    return A.level;
  }
  const meterFill = document.getElementById("meterFill");

  /* ---------- pose ---------- */
  const clock = new THREE.Clock();
  let talkAvg = 0, nod = 0, nodV = 0, lastLvl = 0;
  const blink = { at: 1.2, t: -1, dbl: false };
  function pose(t, dt) {
    const lvl = readLevel(dt);
    talkAvg += (lvl - talkAvg) * (1 - Math.exp(-dt * 1.5));     // "is he in a sentence" (slow)
    meterFill.style.height = (lvl * 100).toFixed(1) + "%";

    // mouth: Ziggy uses his baked visemes; live audio / mic / test talk fake the shapes from
    // loudness (wider on quiet syllables, rounder and deeper on loud ones), then everything eases
    const tgt = zShape() || (() => {
      const o = Math.pow(lvl, 0.8);
      return { open: o, wide: 0.62 - 0.2 * o + 0.12 * Math.sin(t * 5.3), round: 0.35 * o * (0.5 + 0.5 * Math.sin(t * 3.1)),
               teeth: 0.5 * Math.max(0, 0.5 - o), tongue: 0.5 * o };
    })();
    const cur = mouth.userData.cur, km = 1 - Math.exp(-dt * 30);
    for (const key in cur) cur[key] += (tgt[key] - cur[key]) * km;
    setMouth(cur);

    // little nod kicks on syllable onsets (spring), plus idle breathing and sway
    if (lvl - lastLvl > 0.12) nodV -= 2.6 * (lvl - lastLvl);
    lastLvl = lvl;
    nodV += (-nod * 90 - nodV * 12) * dt;
    nod += nodV * dt;

    const breath = Math.sin(t * 1.9) * 0.012;
    bodyG.scale.set(1 + breath * 0.5, 1 + breath * 0.6 + lvl * 0.012, 1 + breath * 0.5);
    bodyG.rotation.z = Math.sin(t * 0.8) * 0.015 * (1 + talkAvg * 2);
    bodyG.rotation.y = Math.sin(t * 0.53) * 0.04 * talkAvg;

    head.rotation.x = Math.sin(t * 0.9) * 0.02 + nod * 0.6 - 0.03 * talkAvg;
    head.rotation.z = Math.sin(t * 0.7) * 0.04 + Math.sin(t * 1.7) * 0.03 * talkAvg;
    head.rotation.y = Math.sin(t * 0.45) * 0.05 * talkAvg;

    // brows lift a hair when he's loud
    brows[0].position.y = brows[0].userData.y0 + 0.03 * lvl;
    brows[1].position.y = brows[1].userData.y0 + 0.03 * lvl;

    // his free arm gestures while he talks; the whisk arm stays low
    arms.forEach(a => {
      const d = a.rest.clone();
      if (a.side > 0) {
        const g = talkAvg * (0.55 + 0.25 * Math.sin(t * 2.3));
        d.add(new THREE.Vector3(0.35 * g, 0.75 * g, 0.5 * g));
      } else {
        d.add(new THREE.Vector3(0, 0.08 * talkAvg * Math.sin(t * 1.6), 0.1 * talkAvg));
      }
      a.dir = d.normalize();
      a.pivot.quaternion.setFromUnitVectors(DOWN, a.dir);
    });
    tail.rotation.y = Math.sin(t * 2.2) * 0.25;

    // blink at random 2-5.5 s gaps (sometimes a quick double): snap shut, hold, ease open
    if (blink.t < 0 && t >= blink.at) blink.t = 0;
    let b = 1;
    if (blink.t >= 0) {
      blink.t += dt;
      const c = blink.t;
      b = c < 0.05 ? 1 - 0.95 * (c / 0.05) : c < 0.09 ? 0.05 : c < 0.19 ? 0.05 + 0.95 * smo((c - 0.09) / 0.1) : 1;
      if (c >= 0.19) {
        blink.t = -1;
        if (!blink.dbl && Math.random() < 0.22) { blink.dbl = true; blink.at = t + 0.1; }
        else { blink.dbl = false; blink.at = t + 2 + Math.random() * 3.5; }
      }
    }
    eyes.forEach(e => { e.scale.y = Math.max(0.05, b); });
    runAct(t, dt);
    bodyG.updateMatrixWorld(true);
    blendHullMat.uniforms.uBodyInv.value.copy(bodyG.matrixWorld).invert();
    scarfHullMat.uniforms.uBodyInv.value.copy(bodyG.matrixWorld).invert();

    head.getWorldPosition(tmp);
    [bodyMat, shirtMat, armMat].forEach(m => {
      m.uniforms.uAOc.value.copy(tmp);
      m.uniforms.uAOr.value.set(HEAD.a * bodyG.scale.x, HEAD.b * bodyG.scale.y, HEAD.c * bodyG.scale.z);
      m.uniforms.uGround.value = root.position.y;
    });
    bodyMat.uniforms.uHem.value = root.position.y + bodyG.position.y + HEM_Y * bodyG.scale.y;
  }
  const tmp = new THREE.Vector3();
  brows.forEach(b => { b.userData.y0 = b.position.y; });

  /* ---------- camera ---------- */
  const TARGET = new THREE.Vector3(0, 1.85, 0);
  function homeCam() {
    const halfH = 2.95;
    const vf = THREE.MathUtils.degToRad(camera.fov) / 2;
    const hf = Math.atan(Math.tan(vf) * camera.aspect);
    const dist = Math.max(halfH / Math.tan(vf), 2.4 / Math.tan(hf)) * 1.05 + 0.8;
    controls.target.copy(TARGET);
    camera.position.copy(TARGET).addScaledVector(new THREE.Vector3(0.0, 0.08, 1).normalize(), dist);
    controls.update();
  }
  controls.maxPolarAngle = Math.PI;
  controls.minDistance = 2;
  let userMoved = false;
  controls.addEventListener("start", () => { userMoved = true; });
  function resize() {
    const w = canvas.clientWidth || innerWidth, h = canvas.clientHeight || innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    // same on-screen weight the old world-space lines had at the default framing
    const db = renderer.getDrawingBufferSize(new THREE.Vector2());
    OUTLINE_SHARED.uRes.value.copy(db);
    OUTLINE_SHARED.uPx.value = 0.0026 * db.y / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
    if (!userMoved) homeCam();
  }
  addEventListener("resize", resize);
  resize();
  document.getElementById("reset").addEventListener("click", () => { userMoved = false; homeCam(); });

  /* ---------- backgrounds (the canvas paints them so recordings include them) ---------- */
  const BG = { clear: null, green: 0x00ff00 };
  let bgName = "clear";
  function setBg(name) {
    bgName = name;
    document.body.className = document.body.className.replace(/\bbg-\w+/, "") + " bg-" + name;
    if (BG[name] === null) renderer.setClearColor(0x000000, 0);
    else renderer.setClearColor(BG[name], 1);
    shadow.visible = false;              // the floor shadow only suited the old Studio backdrop
    document.querySelectorAll("[data-bg]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.bg === name)));
  }
  document.querySelectorAll("[data-bg]").forEach(b => b.addEventListener("click", () => setBg(b.dataset.bg)));
  setBg("clear");

  /* ---------- record canvas + audio to webm ---------- */
  let rec = null;
  const recBtn = document.getElementById("rec");
  recBtn.addEventListener("click", async () => {
    if (rec) { rec.stop(); return; }
    ensureCtx(); await A.ctx.resume();
    const stream = canvas.captureStream(60);
    A.dest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr));
    const types = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"];
    const mimeType = types.find(t => MediaRecorder.isTypeSupported(t));
    const chunks = [];
    rec = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 12e6 });
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => {
      const blob = new Blob(chunks, { type: "video/webm" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "chef-chub-" + bgName + ".webm";
      a.click();
      rec = null;
      recBtn.setAttribute("aria-pressed", "false");
      recBtn.textContent = "Record";
      document.body.classList.remove("clean");
    };
    rec.start(250);
    recBtn.setAttribute("aria-pressed", "true");
    recBtn.textContent = "Stop";
    if (A.el.src) { A.el.currentTime = 0; A.el.play(); }
    else if (ZG.env) { ZG.el.currentTime = 0; ZG.el.play(); }    // video only: line the voice mp3 up at frame 0 in the editor
    showToast(A.el.src || ZG.env ? "Recording — stops when the audio ends" : "Recording — press Stop when done", 2200);
  });

  addEventListener("keydown", e => {
    if (e.key === "h" || e.key === "H") document.body.classList.toggle("clean");
    if (e.target === document.body && { 1: "wave", 2: "kiss", 3: "pan" }[e.key]) startAct({ 1: "wave", 2: "kiss", 3: "pan" }[e.key]);
    if (e.key === " " && e.target === document.body) { e.preventDefault(); playBtn.click(); }
  });

  /* ---------- loop ---------- */
  function loop() {
    requestAnimationFrame(loop);
    const dt = Math.min(clock.getDelta(), 0.05);
    pose(clock.elapsedTime, dt);
    controls.update();
    // depth prepass for the screen-space rim light: him only, no outline shells or floor shadow
    const sz = renderer.getDrawingBufferSize(new THREE.Vector2());
    if (depthRT.width !== sz.x || depthRT.height !== sz.y) depthRT.setSize(sz.x, sz.y);
    SHARED.uRes.value.copy(sz);
    SHARED.uNear.value = camera.near; SHARED.uFar.value = camera.far;
    SHARED.uRimPx.value = 4.5 * renderer.getPixelRatio();   // the shader scales it with distance
    hulls.forEach(h => { h.visible = false; });
    fx.visible = false;
    const shadowWas = shadow.visible;
    shadow.visible = false;
    scene.overrideMaterial = depthOnly;
    renderer.setRenderTarget(depthRT);
    renderer.clear();
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    scene.overrideMaterial = null;
    hulls.forEach(h => { h.visible = true; });
    fx.visible = true;
    shadow.visible = shadowWas;
    renderer.render(scene, camera);
  }
  const depthRT = new THREE.WebGLRenderTarget(1, 1, {
    depthTexture: new THREE.DepthTexture(1, 1, THREE.UnsignedIntType),
    minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter
  });
  depthRT.depthTexture.minFilter = depthRT.depthTexture.magFilter = THREE.NearestFilter;
  SHARED.uDepth.value = depthRT.depthTexture;
  const depthOnly = new THREE.MeshBasicMaterial({ colorWrite: false });
  loop();
  window.__chef = { A, mouth, head, camera, controls };
  }
})();
</script>
</body>
</html>
